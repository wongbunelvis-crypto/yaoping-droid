plugins {
    id 'com.android.application'
}

android {
    namespace 'com.suchuan.yaopingdroid'
    compileSdk 34

    defaultConfig {
        applicationId "com.suchuan.yaopingdroid"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile rootProject.file("release.jks")
            storePassword "yaoping123"
            keyAlias "yaoping"
            keyPassword "yaoping123"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
