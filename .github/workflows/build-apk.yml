name: BuildAPK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          ls "$SDK"
          ls "$SDK/platforms" || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$SDK/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -keystore release.jks -alias yaoping \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yaoping123 -keypass yaoping123 \
            -dname "CN=Yaoping, O=Suchuan, C=HK" \
            -storetype JKS

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload apk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YaopingDroid-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
